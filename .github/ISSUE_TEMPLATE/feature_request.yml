name: Feature request
description: Suggest a change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `AGENTS.md` lists things deliberately left out — telemetry, a hosted sync service,
        and a generic webhook destination. Those need a case made, not just a request.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you have it do instead?
    validations:
      required: true
