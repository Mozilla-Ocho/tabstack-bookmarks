name: Release

# Tag a version and this builds the exact packages that get uploaded to the two
# stores, so the zips are never whatever happened to be in someone's .output.
on:
  push:
    tags: ['v*']
  # Same job without the tag, for rehearsing it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WXT names the zips after package.json's version, and that version becomes
      # the manifest version the stores enforce. A tag that disagrees with it means
      # uploading something labelled differently from what was tagged — so check
      # before spending five minutes building it.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $packaged" >&2
            exit 1
          fi

      # A release nobody can read is a release nobody trusts, and an entry still
      # sitting under [Unreleased] means the changelog was not finished. Ten
      # seconds here beats finding out after a five-minute build.
      - name: Check the changelog documents this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" --check

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The full gate again. A tag can point at a commit that never saw CI.
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - run: pnpm build:firefox
      - run: pnpm build
      - run: pnpm exec web-ext lint --source-dir .output/firefox-mv3 --warnings-as-errors=false

      - run: pnpm zip:firefox
      - run: pnpm zip

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          # WXT builds into `.output`, and upload-artifact skips dot-prefixed
          # paths unless told otherwise — which looks exactly like "the zips were
          # never built". They were; the first real CI run said so.
          include-hidden-files: true
          path: .output/*.zip
          if-no-files-found: error

      # Draft, not published: the store listings and the changelog entry still
      # want a human before anyone is told the release exists.
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the changelog entry itself, so the release says what
          # changed instead of pointing at a file the reader has to go and find.
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /tmp/notes.md
          cat >> /tmp/notes.md <<'FOOTER'

          ---

          Firefox users: install from AMO once this version is reviewed, or take
          `-firefox.zip` here. `-sources.zip` accompanies the AMO submission, as
          the package is bundled. `-chrome.zip` is the Chrome Web Store upload.
          FOOTER

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            .output/*.zip
