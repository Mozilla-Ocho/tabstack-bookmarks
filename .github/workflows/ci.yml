name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; the release workflow asks for more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `wxt prepare`, which generates the types tsc needs.
      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test:coverage

      - run: pnpm build:firefox

      - run: pnpm build

      # Catches manifest problems that a successful build does not. Pinned as a
      # devDependency so the pipeline does not change under us.
      - run: pnpm exec web-ext lint --source-dir .output/firefox-mv3 --warnings-as-errors=false

      - name: Package
        run: pnpm zip:firefox && pnpm zip

      # Both stores' uploads, so a PR can be installed and walked through before
      # it is merged, not only after a release is tagged.
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            .output/*-firefox.zip
            .output/*-sources.zip
            .output/*-chrome.zip
          if-no-files-found: error
