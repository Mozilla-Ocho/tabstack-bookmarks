version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain, one for everything else — a published
      # extension needs security updates noticed, not 12 PRs ignored.
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    ignore:
      # TypeScript is pinned to 6.x on purpose: typescript-eslint refuses to run
      # against 7, and type-aware linting is worth more than being on the newest
      # compiler. Patches and minors still come through; the major does not, so
      # this stops a PR nobody can merge arriving every week. Remove this once
      # typescript-eslint supports 7 — see AGENTS.md.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
